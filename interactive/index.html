<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavya.Work - Interactive Story & Portfolio Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #e0e0e0;
            /* Full-height flex column: content area on top, choices drawer
               docked at the bottom. The content area scrolls on its own, so
               nothing is ever hidden behind the drawer. */
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Top Bar Navigation */
        #top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #161616;
            border-bottom: 1px solid #2a2a2a;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Level-Up Bar */
        .level-bar-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .level-badge {
            font-size: 0.7rem;
            font-weight: bold;
            color: #00adb5;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
            min-width: 60px;
        }

        .level-track {
            width: 120px;
            height: 8px;
            background-color: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .level-fill {
            height: 100%;
            background: linear-gradient(90deg, #00adb5, #6c5ce7);
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        .level-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.15) 50%, transparent 100%);
            animation: levelShimmer 2s infinite;
        }

        @keyframes levelShimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .level-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            margin-bottom: 8px;
            z-index: 60;
        }

        .level-bar-container:hover .level-tooltip {
            opacity: 1;
        }

        /* Level-Up Flash Animation */
        @keyframes levelUpFlash {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 173, 181, 0.6);
            }

            50% {
                box-shadow: 0 0 20px 4px rgba(0, 173, 181, 0.4);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 173, 181, 0);
            }
        }

        .level-up-flash {
            animation: levelUpFlash 0.8s ease-out;
        }

        .history-btn {
            background-color: #242424;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .history-btn:hover {
            border-color: #00adb5;
            color: #00adb5;
            background-color: #1a1a1a;
        }

        /* Main Container Layout */
        #story-container {
            /* Shrinks to whatever is left above the choices drawer */
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            /* Scrolls only as a fallback on very short viewports */
            overflow-x: hidden;
            overflow-y: auto;
            padding: 90px 24px 24px 24px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            /* Firefox */
            scrollbar-width: thin;
            scrollbar-color: #444 #181818;
        }

        .game-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 24px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 173, 181, 0.4);
        }

        /* Name Input Field */
        .name-input-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .name-input-field {
            background: #1e1e1e;
            border: 1px solid #444;
            border-bottom: 2px solid #00adb5;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            padding: 6px 12px;
            border-radius: 4px;
            outline: none;
            width: 180px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .name-input-field:focus {
            border-color: #00adb5;
            box-shadow: 0 0 8px rgba(0, 173, 181, 0.3);
        }

        .name-input-field::placeholder {
            color: #666;
            font-style: italic;
        }

        .name-submit-btn {
            background: #1a1a1a;
            border: 1px solid #00adb5;
            color: #00adb5;
            font-family: inherit;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .name-submit-btn:hover {
            background: #00adb5;
            color: #121212;
        }

        .name-display {
            color: #00adb5;
            font-weight: bold;
        }

        .dialogue-box {
            width: 100%;
            line-height: 1.7;
        }

        /* 1. Static Layout (Float images alongside text) */
        .dialogue-box.static-wrap-layout .dialogue-image-column.float-left {
            float: left;
            margin: 0 24px 16px 0;
            max-width: 45%;
        }

        .dialogue-box.static-wrap-layout .dialogue-image-column.float-right {
            float: right;
            margin: 0 0 16px 24px;
            max-width: 45%;
        }

        .dialogue-box.static-wrap-layout::after {
            content: "";
            display: table;
            clear: both;
        }

        /* 2. Interactive Side-by-Side Flex Layout */
        .dialogue-box.side-by-side-layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .dialogue-text-column {
            flex: 1;
        }

        .side-by-side-layout .dialogue-image-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-width: 50%;
        }

        /* Images and Lightbox */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        .dialogue-image {
            max-width: 100%;
            max-height: 40vh;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid #444;
            display: none;
            cursor: zoom-in;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .dialogue-image:hover {
            transform: scale(1.02);
            border-color: #00adb5;
        }

        .dialogue-image.active-slide {
            display: block !important;
        }

        /* Typography */
        .dialogue-box p {
            font-size: 1.05rem;
            margin-bottom: 16px;
            color: #e0e0e0;
        }

        .dialogue-box ul,
        .dialogue-box ol {
            margin: 0 0 20px 24px;
            line-height: 1.6;
        }

        .dialogue-box li {
            margin-bottom: 8px;
        }

        .dialogue-box b,
        .dialogue-box strong {
            color: #ffffff;
            font-size: 1.1rem;
        }

        .dialogue-box code {
            background: #222;
            color: #00adb5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: inherit;
        }

        /* Choice Drawer */
        #choices-drawer {
            /* Docked as the last row of the page's flex column instead of being
               fixed over the content, so the content above can never be hidden
               behind it. */
            flex: 0 0 auto;
            width: 100%;
            background-color: #121212;
            border-top: 2px solid #333;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.8);
        }

        .drawer-toggle {
            width: 100%;
            max-width: 800px;
            padding: 12px 20px;
            background: #1a1a1a;
            border: none;
            color: #00adb5;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px 8px 0 0;
        }

        .drawer-toggle:hover {
            background-color: #222;
        }

        .drawer-content {
            width: 100%;
            max-width: 800px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out;
            padding: 0 20px;
        }

        #choices-drawer.open .drawer-content {
            max-height: 50vh;
            overflow-y: auto;
            padding: 12px 20px 20px 20px;
        }

        #choices-drawer.open .toggle-icon {
            transform: rotate(180deg);
        }

        .toggle-icon {
            transition: transform 0.3s ease;
        }

        .choices-list {
            list-style: none;
            width: 100%;
        }

        .choice-item {
            position: relative;
            padding: 12px 16px 12px 36px;
            margin-bottom: 10px;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
        }

        .choice-item::before {
            content: '▶';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 0.8rem;
        }

        .choice-item.visited {
            opacity: 0.65;
            background-color: #161616;
            border-style: dashed;
        }

        .choice-item.visited::before {
            content: '✓';
            color: #00adb5;
        }

        .choice-item:hover {
            background-color: #2a2a2a;
            border-color: #00adb5;
            color: #ffffff;
            transform: translateX(4px);
        }

        /* History Drawer */
        #history-drawer {
            position: fixed;
            top: 0;
            right: -360px;
            width: 360px;
            height: 100vh;
            background-color: #181818;
            border-left: 2px solid #333;
            z-index: 200;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.8);
        }

        #history-drawer.open {
            right: 0;
        }

        .history-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        .history-list {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            list-style: none;
        }

        .history-entry {
            padding: 10px;
            margin-bottom: 8px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .history-entry:hover {
            border-color: #00adb5;
            color: #00adb5;
        }

        .reset-btn-container {
            padding: 20px;
            border-top: 1px solid #333;
        }

        .reset-btn {
            width: 100%;
            background-color: #2b1414;
            color: #ff5555;
            border: 1px solid #ff5555;
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #ff5555;
            color: #ffffff;
        }

        /* Lightbox Modal */
        #lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #lightbox-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 6px;
            border: 2px solid #444;
        }

        .lightbox-close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            background: #242424;
            color: #ffffff;
            border: 1px solid #555;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .lightbox-close-btn:hover {
            border-color: #00adb5;
            color: #00adb5;
        }

        /* Scrollable Dialogue Window */
        #dialogue-box {
            /* Fills the space above the choices drawer and scrolls on its own.
               The min-height keeps it visible/usable even on very short
               viewports, where the container scrolls instead. */
            flex: 1 1 auto;
            min-height: 72px;
            overflow-y: auto;
            padding-right: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            /* Firefox */
            scrollbar-width: thin;
            scrollbar-color: #444 #181818;
        }

        /* Custom Scrollbar for Dialogue Box */
        #dialogue-box::-webkit-scrollbar {
            width: 8px;
        }

        #dialogue-box::-webkit-scrollbar-track {
            background: #181818;
            border-radius: 4px;
        }

        #dialogue-box::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        #dialogue-box::-webkit-scrollbar-thumb:hover {
            background: #00adb5;
        }

        /* Choice Section Line Breaks */
        .dialogue-card.choice-break {
            margin-top: 16px;
            border-top: 1px dashed #333;
            padding-top: 16px;
        }

        /* Individual Dialogue Cards */
        .dialogue-card {
            background-color: #1a1a1a;
            border-left: 4px solid #00adb5;
            border-radius: 4px;
            padding: 12px 16px;
            line-height: 1.5;
        }

        .dialogue-card.user-talk {
            background-color: #1e262b;
            border-left-color: #ff9f43;
        }

        .dialogue-card.action-talk {
            background-color: #161616;
            border-left-color: #6c5ce7;
            font-style: italic;
        }

        .speaker-label {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00adb5;
            margin-bottom: 4px;
        }

        .dialogue-card.user-talk .speaker-label {
            color: #ff9f43;
        }

        .dialogue-card.action-talk .speaker-label {
            color: #a29bfe;
        }

        /* Animated ASCII Jump Effect */
        @keyframes asciiJump {
            0% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-20px) scaleY(1.05);
            }

            60% {
                transform: translateY(0) scaleY(0.95);
            }

            80% {
                transform: translateY(-6px);
            }

            100% {
                transform: translateY(0);
            }
        }

        .ascii-jumping {
            display: inline-block;
            font-family: monospace;
            white-space: pre;
            color: #00adb5;
            font-weight: bold;
            animation: asciiJump 0.6s ease-in-out;
        }

        @media (max-width: 768px) {
            .dialogue-box.side-by-side-layout {
                flex-direction: column;
            }

            .side-by-side-layout .dialogue-image-column {
                max-width: 100%;
            }

            .dialogue-box.static-wrap-layout .dialogue-image-column.float-left,
            .dialogue-box.static-wrap-layout .dialogue-image-column.float-right {
                float: none;
                max-width: 100%;
                margin: 0 0 16px 0;
            }
        }

        /* Short viewports (e.g. landscape phones): trim the header offset and
           title so the content window keeps a usable height even when the
           choices drawer is expanded. */
        @media (max-height: 620px) {
            #story-container {
                padding-top: 74px;
                padding-bottom: 12px;
            }

            .game-title {
                font-size: 1.3rem;
                margin-bottom: 12px;
                letter-spacing: 2px;
            }

            #choices-drawer.open .drawer-content {
                /* Never let the expanded drawer crowd out the content area */
                max-height: min(42vh, calc(100vh - 260px));
            }
        }
    </style>
</head>

<body>

    <header id="top-header">
        <div class="header-left">
            <div class="header-title">Kavya.Work</div>
            <div class="level-bar-container" id="level-bar-container">
                <span class="level-badge" id="level-badge">Lv. 0</span>
                <div class="level-track">
                    <div class="level-fill" id="level-fill" style="width: 0%"></div>
                </div>
                <div class="level-tooltip" id="level-tooltip">Explore more to level up!</div>
            </div>
        </div>
        <div class="header-right" style="display:flex;align-items:center;gap:12px;">
            <a href="../" style="color:#888;font-size:0.85rem;text-decoration:none;">Home</a>
            <a href="../traditional/" style="color:#888;font-size:0.85rem;text-decoration:none;">Classic site</a>
            <button class="history-btn" id="open-history">📜 History & Progress</button>
        </div>
    </header>

    <main id="story-container">
        <h1 class="game-title" id="page-main-title">Kavya.Work</h1>
        <div class="dialogue-box" id="dialogue-box"></div>
    </main>

    <!-- Slide-Up Choices Drawer -->
    <aside id="choices-drawer">
        <button class="drawer-toggle" id="drawer-toggle">
            <span>Choose an action / response...</span>
            <span class="toggle-icon">▲</span>
        </button>
        <div class="drawer-content">
            <ul class="choices-list" id="choices-list"></ul>
        </div>
    </aside>

    <!-- Navigation History Drawer -->
    <aside id="history-drawer">
        <div class="history-header">
            <h3>Adventure History</h3>
            <button class="close-btn" id="close-history">&times;</button>
        </div>
        <ul class="history-list" id="history-list"></ul>
        <div class="reset-btn-container">
            <button id="reset-progress-btn" class="reset-btn">Reset All Progress</button>
        </div>
    </aside>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal">
        <button class="lightbox-close-btn" id="close-lightbox">&times;</button>
        <img src="" alt="Expanded View" class="lightbox-content" id="lightbox-img">
    </div>

    <script>
        /**
         * Global Engine State Tracker
         */
        const gameState = {
            visitedSections: new Set(JSON.parse(localStorage.getItem('visited_sections') || '[]')),
            visitCounts: JSON.parse(localStorage.getItem('visit_counts') || '{}'),
            flags: JSON.parse(localStorage.getItem('game_flags') || '{}'),
            playerName: localStorage.getItem('player_name') || ''
        };

        /**
         * LEVEL SYSTEM CONFIGURATION
         * 10 levels with placeholder names. Thresholds are auto-calculated
         * based on total discoverable content in storyData.
         * The player STARTS BELOW Level 1 (at "Lv. 0") with an empty progress
         * bar that fills toward Level 1 as they discover content.
         */
        const LEVEL_CONFIG = [
            { name: "Newcomer" },        // Level 1
            { name: "Curious" },         // Level 2
            { name: "Explorer" },        // Level 3
            { name: "Pathfinder" },      // Level 4
            { name: "Wayfarer" },        // Level 5
            { name: "Adventurer" },      // Level 6
            { name: "Trailblazer" },     // Level 7
            { name: "Lorekeeper" },      // Level 8
            { name: "Sage" },            // Level 9
            { name: "Completionist" }    // Level 10
        ];
        const MAX_LEVEL = LEVEL_CONFIG.length;

        /**
         * Name shown while the player has not yet reached Level 1.
         * This is the "Lv. 0" starting state — the progress bar begins
         * unfilled and fills as it approaches Level 1 ("Newcomer").
         */
        const PRE_LEVEL_NAME = "Unranked";

        /**
         * MAIN STORY DATA CONFIGURATION OBJECT
         * Content can be an array OR a function: (flags, visitCount) => [...]
         */
        const storyData = {
            // ------------------------------------------------------------------------
            // SECTION: #homepage
            // ------------------------------------------------------------------------
            "homepage": {
                name: "Homepage",
                pageType: "interactive",
                condition: (flags) => true,

                content: (flags, visitCount) => {
                    // STAGE 0: Initial state before clicking "Hello?"
                    if (!flags["intro_start"]) {
                        return [
                            "<i>&lt;humming the tune to jingle bells&gt;</i>"
                        ];
                    }

                    const asciiJumpingPerson = `
<span class="ascii-jumping">
  \\ (•◡•) /
    \\  /
     ||
    /  \\
</span>`;

                    // STAGE 1: Immediate reaction after clicking "Hello?"
                    if (flags["intro_start"] && !flags["intro_choice_1"] && !flags["intro_choice_2"]) {
                        return [
                            "<i>*jumps*</i> " + asciiJumpingPerson,
                            "Oh hello, I didn't see you there. What brings you here?"
                        ];
                    }

                    // STAGE 2: Response after selecting Choice 1 or Choice 2 + Full Intro
                    let reactionText = "";
                    if (flags["intro_choice_1"]) {
                        reactionText = "Oh, I did? Of course I did. Sorry I am easily spooked. Welcome!";
                    } else if (flags["intro_choice_2"]) {
                        reactionText = "Interesting, we should chat more about how you landed here, but for now, welcome!";
                    }

                    // RETURNING VISITOR GREETINGS
                    // `visitCount` is homex — how many times the player has been
                    // to #homepage. The more they come back, the more familiar
                    // Kavya gets. The highest matching threshold wins.
                    const nameSpan = gameState.playerName
                        ? `<span class="name-display">${gameState.playerName}</span>`
                        : "friend";

                    const returnGreetings = [
                        { minVisits: 21, text: "At this point you come here more than I do. Have you perhaps seen my coffee mug anywhere? I haven't been able to find it since the last time you were here." },
                        { minVisits: 16, text: "Hey <player_name>, at this point you should move in." },

                    ];

                    const returningGreeting = returnGreetings
                        .find(greeting => visitCount >= greeting.minVisits);

                    const greetingText = returningGreeting
                        ? returningGreeting.text.replace("<player_name>", nameSpan)
                        : (gameState.playerName
                            ? `Nice to meet you, <span class="name-display">${gameState.playerName}</span>! What would you like to explore?`
                            : null);

                    const result = [

                        result.push(greetingText);
                    } else {

                        result.push({ type: 'name_input' });
                    }

                    return result;

            "blog_minecraft": {
                name: "Minecraft: A Relationship Bound To End In Divorce",
                pageType: "static",
                condition: (flags) => true,

                content: [
                    "<b>February 2023</b>",
                    { type: "image", src: "../images/blog-minecraft.jpg", align: "right" },
                    "Minecraft has to be one of the most popular games in gaming history. More than a decade after its first release, it remains one of the most popular titles. It has a loyal fanbase that continues to recruit new players and experiment with mods.",
                    "So what is Minecraft? If you're like me, you have only heard of the game without knowing anything about the game. Minecraft is a sandbox game developed by Mojang studios. Created by Markus \"Notch\" Persson, the game's goal is to survive in a massive open-world randomly generated map. There are no tangible milestones to chase or storyline that intrigues a player. In fact, there are hardly even instructions on how to play the game.",
                    "The lack of information provided in the game and how differently every player plays it definitely contributed to my misconceptions about it. Almost two years ago, when talking to a friend, the person who later introduced me to the game, I said, \"I thought it was all about combat.\" I explained to him how I thought the game was purely based on the shoot-and-kill mechanics, and he was beyond surprised at my assumption. He told me it was a relaxing game, and I was not convinced.",
                    "Now that I have put a decent amount of hours into the game, I am more qualified to write about it.",
                    "One of the things I love about Minecraft is how its gameplay is customizable to each player. There's no set path for me to follow, no milestones to finish, and no mechanics with which I am forced to interact. The game can be played however I like. Which to me means chopping down trees, building something basic and annoying my friends who are on the server.",
                    "It's mostly the annoying friends part that I enjoy. Minecraft, at its core, is a game designed to be enjoyed in a community space. Sure, it's fun in a single-player, but it's better when played in a group. Playing in a group also means exploring the various aspects of the game without actually having to engage with mechanics that I do not enjoy. For example, combat is one Minecraft mechanic that I absolutely despise. There's no reason for it other than my unwillingness to learn. I am not someone who enjoys combat in any game. So when I play with a group, I hide behind whoever is the best fighter while they handle the mobs in the game.",
                    "But two years after my first conversation about Minecraft, I realize the game is about more than just fighting. When you start a new save on Minecraft, you're dropped into a random world with no resources or tools. To survive, you must forage for everything from food to building materials. It's overwhelming the first time, and it's overwhelming the second time. It would likely take many hours of gameplay before I am at ease with the game's mechanics. I survived because I had pro gamers watching my back and telling me what to do, but something tells me I would have given up very soon if I was playing on my own. The lack of instructions in the game can be frustrating.",
                    "The thing I enjoyed the most in Minecraft is the building aspect of it. I spent far too much time in the game, not knowing that I could randomly build whatever I wanted, whenever, wherever I wanted. The experience was life-changing, to be honest, because I genuinely looked forward to the game for the first time. I was thinking about what I would do to the house I was building and planning the resources I would need to do the same. The revelation literally came as a wrecking ball, completely overhauling my perception of the game.",
                    "So why, if I love the game, is it a relationship bound to end in divorce? Minecraft is a good game, but it's not for me. There is enough in the game that I love for me to play it for a short duration. But if I were to play it any longer, I start to grow tired and find faults in everything the game offers.",
                    "I love the building aspect, but I hate the grind for resources. Yes, there is always the option of creative mode. Still, it feels like cheating somehow and takes away from another aspect I love about the game, resource collection. I hate that resource collection always has to be done manually or requires complicated builds that take far too much effort and investment of time and resources. In short, it's a relationship bound to end in divorce.",
                    "Am I perhaps being too harsh on the game? Probably. When I first started playing the game, primarily out of respect for my friend, I was not in the right headspace for serious gaming, let alone learning a game that requires the amount of time and investment required by Minecraft. Not only was I not committed enough to the game, but I was also playing with people who had been playing the game for far too long. For the most part, I was busy trying to keep pace rather than explore the game alone.",
                    "To give the game a second chance, I booted it up while writing this review to try it by myself now that I know the basic controls and won't immediately die. But I spawned in a desert with vast amounts of sand to see and not a single tree to punch. Unsurprisingly, I died to creepers thrice in the twenty minutes I played. Let's say the inevitable happened — the divorce."
                ],

                choices: [
                    { id: "choice_blog_minecraft_blogs", text: "Back to the blog list.", target: "blogs" },
                    { id: "choice_blog_minecraft_trad", text: "Read this article on the classic portfolio site.", target: "../traditional/blogs/minecraft-relationship-bound-to-end-in-divorce.html" },
                    { id: "choice_blog_minecraft_exit", text: "I'd like to explore by myself. [Exit text RPG mode]", target: "../traditional/blogs/minecraft-relationship-bound-to-end-in-divorce.html" }
                ]
            },

            "blog_overcooked": {
                name: "Overcooked 2: The World's Most Chaotic Hang Out Session",
                pageType: "static",
                condition: (flags) => true,

                content: [
                    "<b>February 2023</b>",
                    { type: "image", src: "../images/blog-overcooked-2.jpg", align: "left" },
                    "A cooking simulation game developed by Team 17 alongside Ghost Town Games, Overcooked 2 is a co-op game for teams of 4. The gameplay is simple in this top-down simulator, you are thrown into the fast paced service industry as soon as you take control of a character on screen. We gather, prep and cook ingredients mentioned in the recipe, those are then assembled in a plate and served to waiting customers. But, it's not just about being a chef, you also gather used dishes, clean them and reuse the cleaned dishes for the next round of order. Basically, you run a restaurant.",
                    "Just like a real restaurant, Overcooked 2 is not a game you can play alone, unless you're a pro-gamer or if you have nerves of steel. Since I have neither, the first time I played was with a team. In the co-op mode we, a single team of 4, tried to make our way through the levels.",
                    "It tested our coordination skills, our patience and our ability to keep our voices down in the middle of the night. Overcooked 2 is undoubtedly a very well designed game that puts both your mechanical skills and your strategy skills to test. You don't need to be proficient at the controls if you're really good at time management. It's a game that takes ten minutes to learn and hours to master.",
                    "The game's biggest asset is probably its simplicity. The core of the game is simple, but it never feels monotonous or easy. The complexity of the recipes and the multitude of tasks ramp up the stakes in the cooking simulator. The game's difficulty increases pretty early on, before the end of the first world we were screaming for dishes to be washed, ingredients to be chopped up and sauces to be cooked, and I can tell you from experience none got done on time because we were not just learning to keep up with the game, we were learning to communicate in a way we never had to before.",
                    "While the game makes it harder for people to navigate around the level, it also provides abilities that make the game easier. For example, in levels where the kitchen is spread across multiple platforms, all of which will periodically move, cutting off access to certain parts of the kitchen and certain ingredients if you're not prepared. It's of course slightly easier when there are a bunch of people, because one person can lock themselves into a part of the kitchen ensuring sustained access to the ingredients placed in the area.",
                    "However, having access to ingredients means nothing if we can't pass it onto our team mates, this is where the ability to throw uncooked ingredients comes into play. Being able to toss stuff from one person to another makes the game that much more playable. The ability to throw things around the level map greatly improves maneuverability and creates the opportunity for some very fun moments. It's always a satisfying moment when I lob a chicken leg straight into the fryer, or toss an ingredient right at my teammate. It is also extremely helpful when I need to thwart their rhythm during a vs match."

                    "Half of the work in the world is unpaid, a large portion of which falls on women. It is not a shocking statement; it is something we see every day. There is a glaring inequality of division of unpaid work. The effect of inequality came to the forefront during the lockdown. When the world shut down, the workplace came home. Recognizing the burden that fell on the shoulders of the women of the household became easier to see. Discussions around the problematic aspects of the phenomenon started to gain heat.",

                    "A long, long time ago, in a distant past, everyone was fascinated by the invention that changed the world as it was known. That invention was the internet. In the last decade of the twentieth century, which seems like a millennia ago but was only thirty years in the past, my parents learning to use the computers couldn't have imagined the impact the internet would have on their children. Much less the language they speak and write. It's no surprise the impact of the internet seeped into our lexicon too.",
                    "While the internet has been a significant part of people's lives for the better part of the twenty-first century, it only recently became an indispensable part of our existence. Since the world has entered a lockdown, people's lives have shifted online. Everything from work to shopping to hanging out with friends turned virtual.",

        // ── Cricket Sound Engine (Web Audio API) ─────────────────────────────────
        let cricketAudioCtx = null;
        let cricketNodes = [];
        let cricketInterval = null;

        function startCrickets() {
            if (cricketAudioCtx) return; // already running
            cricketAudioCtx = new (window.AudioContext || window.webkitAudioContext)();

            function chirp() {
                if (!cricketAudioCtx) return;
                const chirpCount = 3 + Math.floor(Math.random() * 3); // 3-5 clicks per chirp
                for (let i = 0; i < chirpCount; i++) {
                    const osc = cricketAudioCtx.createOscillator();
                    const gain = cricketAudioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(cricketAudioCtx.destination);

                    // Crickets chirp at ~4-5 kHz
                    osc.frequency.setValueAtTime(4200 + Math.random() * 600, cricketAudioCtx.currentTime);
                    osc.type = 'sine';

                    const clickStart = cricketAudioCtx.currentTime + i * 0.04;
                    gain.gain.setValueAtTime(0, clickStart);
                    gain.gain.linearRampToValueAtTime(0.08, clickStart + 0.008);
                    gain.gain.linearRampToValueAtTime(0, clickStart + 0.022);

                    osc.start(clickStart);
                    osc.stop(clickStart + 0.025);
                    cricketNodes.push(osc);
                }
            }

            // Fire first chirp immediately then repeat every 0.8–1.6s
            chirp();
            cricketInterval = setInterval(() => {
                chirp();
            }, 800 + Math.random() * 800);
        }

        function stopCrickets() {
            clearInterval(cricketInterval);
            cricketInterval = null;
            if (cricketAudioCtx) {
                cricketAudioCtx.close();
                cricketAudioCtx = null;
            }
            cricketNodes = [];
        }

        function getNavHistory() {

        }

        function recordChoiceClick(choiceId, choiceText, targetKey) {

        // ── Level System Engine ─────────────────────────────────────────────────
        /**
         * Sections that do NOT count as "discoverable" content.
         * The landing page is where the player starts, so simply loading the
         * engine should not award progress. Without this, the automatic visit
         * to #homepage would push the player past Level 0 (Unranked) the moment
         * the page boots up, defeating the "start with an unfilled Lv. 1 bar" state.
         */
        const NON_DISCOVERABLE_SECTIONS = new Set(["homepage"]);

        /**
         * Calculates total discoverable content dynamically from storyData.
         * Counts: unique discoverable section keys + unique choice IDs across all sections.
         */
        function getTotalDiscoverableCount() {
            const allChoiceIds = new Set();
            let sectionCount = 0;
            for (const key in storyData) {
                const section = storyData[key];
                if (section.choices) {
                    section.choices.forEach(c => allChoiceIds.add(c.id));
                }
                if (NON_DISCOVERABLE_SECTIONS.has(key)) continue;
                sectionCount++;
            }
            return sectionCount + allChoiceIds.size;
        }

        /**
         * Calculates how much the player has discovered.
         * Counts: visited discoverable sections + triggered flags (choice clicks).
         */
        function getPlayerDiscoveredCount() {
            let visitedCount = 0;
            gameState.visitedSections.forEach(key => {
                if (!NON_DISCOVERABLE_SECTIONS.has(key)) visitedCount++;
            });
            const flagCount = Object.keys(gameState.flags).length;
            return visitedCount + flagCount;
        }

        /**
         * Builds progressive level thresholds.
         * Each level requires progressively more discovery.
         * Uses a power curve so early levels are fast, later levels are slower.
         */
        function buildLevelThresholds(totalContent) {
            const thresholds = [];
            for (let i = 0; i < MAX_LEVEL; i++) {
                // Power curve: fraction^1.5 so early levels are easy, later ones are hard
                const fraction = (i + 1) / MAX_LEVEL;
                const threshold = Math.round(totalContent * Math.pow(fraction, 1.5));
                thresholds.push(Math.max(threshold, i + 1)); // at least i+1
            }
            return thresholds;
        }

        /**
         * Determines the player's current level based on discovery count.
         * Starts at 0 (below Level 1) until the first threshold is reached,
         * so the player begins with the progress bar to Level 1 unfilled.
         */
        function getCurrentLevel(discovered, thresholds) {
            let level = 0;
            for (let i = 0; i < thresholds.length; i++) {
                if (discovered >= thresholds[i]) {
                    level = i + 1;
                } else {
                    break;
                }
            }
            return Math.min(level, MAX_LEVEL);
        }

        /**
         * Updates the level bar UI in the header.
         */
        function updateLevelBar() {
            const total = getTotalDiscoverableCount();
            const discovered = getPlayerDiscoveredCount();
            const thresholds = buildLevelThresholds(total);
            const level = getCurrentLevel(discovered, thresholds);
            const levelName = level >= 1 ? LEVEL_CONFIG[level - 1].name : PRE_LEVEL_NAME;

            const badge = document.getElementById('level-badge');
            const fill = document.getElementById('level-fill');
            const tooltip = document.getElementById('level-tooltip');

            // Check for level-up
            const prevLevel = parseInt(badge.textContent.replace(/\D/g, ''), 10) || 0;
            if (level > prevLevel) {
                const container = document.getElementById('level-bar-container');
                container.classList.add('level-up-flash');
                setTimeout(() => container.classList.remove('level-up-flash'), 800);
            }

            badge.textContent = `Lv. ${level}`;

            // Calculate fill percentage toward the NEXT level.
            // Level 0 (the starting state) fills toward Level 1, and every level
            // after that fills toward the level that follows it.
            const prevThreshold = level >= 1 ? thresholds[level - 1] : 0;
            const nextThreshold = level < MAX_LEVEL ? thresholds[level] : total;
            const bracketSize = nextThreshold - prevThreshold;
            const bracketProgress = discovered - prevThreshold;

            let fillPercent;
            if (level >= MAX_LEVEL) {
                fillPercent = 100;
            } else {
                fillPercent = bracketSize > 0
                    ? Math.min(Math.max((bracketProgress / bracketSize) * 100, 0), 100)
                    : 100;
            }
            fill.style.width = fillPercent + '%';

            const playerNameStr = gameState.playerName ? ` — ${gameState.playerName}` : '';
            if (level >= MAX_LEVEL) {
                tooltip.textContent = `✨ ${levelName}${playerNameStr} — Max level reached!`;
            } else {
                const remaining = nextThreshold - discovered;
                const nextLevelName = ` (${LEVEL_CONFIG[level].name})`;
                tooltip.textContent = `${levelName}${playerNameStr} — ${remaining} more to Lv. ${level + 1}${nextLevelName}`;
            }
        }

                    imageContainer.className = 'dialogue-image-column';

                    carouselWrapper = document.createElement('div');
                    carouselWrapper.className = 'carousel-wrapper';
                    imageContainer.appendChild(carouselWrapper);

                    dialogueBox.appendChild(textContainer);
                    dialogueBox.appendChild(imageContainer);
                }

                activeContent.forEach(item => {
                    if (typeof item === 'object' && item.type === 'image') {
                        const sources = Array.isArray(item.src) ? item.src : [item.src];
                        sources.forEach(src => {
                            const img = document.createElement('img');
                            img.src = src;
                            img.className = 'dialogue-image active-slide';
                            img.onerror = () => {
                                img.src = `https://placehold.co/400x250/1e1e1e/00adb5?text=${encodeURIComponent(src.split('/').pop())}`;
                            };
                            img.addEventListener('click', () => openLightbox(img.src));
                            carouselWrapper.appendChild(img);
                        });
                    } else if (typeof item === 'object' && item.type === 'name_input') {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'name-input-wrapper';
                        wrapper.innerHTML = `
                            <input type="text" class="name-input-field" id="name-input" placeholder="Type your name..." maxlength="30" autofocus />
                            <button class="name-submit-btn" id="name-submit-btn">→ Enter</button>
                        `;
                        textContainer.appendChild(wrapper);
                        setTimeout(() => {
                            const inp = document.getElementById('name-input');
                            const btn = document.getElementById('name-submit-btn');
                            if (inp) {
                                inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleNameSubmit(inp); });
                                inp.focus();
                            }
                            if (btn) btn.addEventListener('click', () => handleNameSubmit(document.getElementById('name-input')));
                        }, 50);
                    } else {
                        const div = document.createElement('div');
                        div.innerHTML = item;
                        textContainer.appendChild(div);
                    }
                });
            }

            renderChoices(section);
            updateLevelBar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            dialogueBox.scrollTop = 0;
            if (storyContainer) storyContainer.scrollTop = 0;
        }

        function renderChoices(section) {
            const choicesList = document.getElementById("choices-list");
            choicesList.innerHTML = "";

            const choices = section.choices || [];

            choices.forEach(choice => {
                // Choice-level Condition Gate
                if (choice.condition && !choice.condition(gameState.flags)) {
                    return;
                }

                const li = document.createElement("li");
                li.className = "choice-item" + (gameState.flags[choice.id] ? " visited" : "");
                li.textContent = choice.text;

                li.addEventListener("click", () => {
                    recordChoiceClick(choice.id, choice.text, choice.target);
                    updateLevelBar();

                    // Handle ../traditional / external HTML file redirection
                    if (choice.target === "traditional_index" || choice.target.includes("../traditional") || choice.target.endsWith(".html")) {
                        const destination = choice.target === "traditional_index" ? "../traditional/index.html" : choice.target;
                        window.location.href = destination;
                        return;
                    }

                    const currentHash = window.location.hash.replace('#', '').trim() || "homepage";

                    // Force immediate re-render when target is the current section
                    if (choice.target === currentHash) {
                        renderSection(choice.target);
                    } else {
                        window.location.hash = choice.target;
                    }
                });

                choicesList.appendChild(li);
            });
        }


        /**
         * Hash Route Router
         * Reads window.location.hash and renders corresponding story section
         */
        function handleHashRoute() {
            const rawHash = window.location.hash.replace('#', '').trim();
            if (rawHash === "traditional_index" || rawHash.includes("../traditional") || rawHash.endsWith(".html")) {
                const destination = rawHash === "traditional_index" ? "../traditional/index.html" : rawHash;
                window.location.href = destination;
                return;
            }
            const targetSection = rawHash || "homepage";
            renderSection(targetSection);
        }

        // Listen for back/forward browser navigation and URL hash edits
        window.addEventListener('hashchange', handleHashRoute);

        // Lightbox Handler
        const lightboxModal = document.getElementById('lightbox-modal');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightboxModal.classList.add('open');
        }

        document.getElementById('close-lightbox').addEventListener('click', () => {
            lightboxModal.classList.remove('open');
        });

        lightboxModal.addEventListener('click', (e) => {
            if (e.target === lightboxModal) lightboxModal.classList.remove('open');
        });

        // History Drawer Handler
        const historyDrawer = document.getElementById("history-drawer");

        function renderHistoryList() {
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";
            const history = getNavHistory();

            if (history.length === 0) {
                historyList.innerHTML = "<li style='color:#777; font-style:italic;'>No history recorded yet.</li>";
                return;
            }

            history.forEach((step, index) => {
                const li = document.createElement("li");
                li.className = "history-entry";
                li.textContent = `${index + 1}. ${step.text}`;

                li.addEventListener("click", () => {
                    historyDrawer.classList.remove("open");
                    if (step.target === "traditional_index" || step.target.includes("../traditional") || step.target.endsWith(".html")) {
                        const destination = step.target === "traditional_index" ? "../traditional/index.html" : step.target;
                        window.location.href = destination;
                    } else {
                        window.location.hash = step.target;
                    }
                });

                historyList.appendChild(li);
            });
        }

        document.getElementById("open-history").addEventListener("click", () => {
            renderHistoryList();
            historyDrawer.classList.add("open");
        });

        document.getElementById("close-history").addEventListener("click", () => {
            historyDrawer.classList.remove("open");
        });

        // Choices drawer toggle (starts minimized; the content area above it
        // resizes automatically because the page is a flex column)
        const choicesDrawer = document.getElementById('choices-drawer');

        document.getElementById("drawer-toggle").addEventListener("click", () => {
            choicesDrawer.classList.toggle("open");
        });

        // Reset Handler
        document.getElementById('reset-progress-btn').addEventListener('click', () => {
            localStorage.clear();
            gameState.flags = {};
            gameState.visitCounts = {};
            gameState.visitedSections.clear();
            gameState.playerName = '';
            historyDrawer.classList.remove("open");
            window.location.hash = "homepage";
            renderSection("homepage");
            updateLevelBar();
        });

        // Engine Initializer
        window.addEventListener('DOMContentLoaded', () => {
            updateLevelBar();
            handleHashRoute();
        });
    </script>
</body>

</html>
